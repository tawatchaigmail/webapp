<h4>detail parameter<h4>
<div>

<form name="detailName" #detailForm="ngForm" (ngSubmit)="doSubmit(detailForm)">
  <label for="seqNo">SeqNo</label>
  <input name="seqNo" id="seqNo" required [(ngModel)]="reportFileParameter.seqNo" #seqNo="ngModel" placeholder="seqNo"/>

  <label for="reportId">ReportId</label>
  <input name="reportId" id="reportId" required [(ngModel)]="reportFileParameter.reportId" #reportId="ngModel" placeholder="ReportId"/>

  <label for="parammetrName">parammetrName</label>
  <input name="parameterName"  id="parameterName" [(ngModel)]="reportFileParameter.parameterName" #parameterName="ngModel" placeholder="parameterName"/>

  <label for="initialValue">initialValue</label>
  <input name="initialValue" id="initialValue" [(ngModel)]="reportFileParameter.initialValue" #initialValue="ngModel" placeholder="initialValue"/>

  <label for="initialValueTo">initialValueTo</label>
  <input name="initialValueTo" id="initialValueTo" [(ngModel)]="reportFileParameter.initialValueTo" #initialValueTo="ngModel" placeholder="initialValueTo"/>

  <label for="deswcription">deswcription</label>
  <input name="description" id="description" [(ngModel)]="reportFileParameter.description" #description="ngModel" placeholder="description"/>

  <label for="rgText">rgText</label>
  <input name="rgText" id="rgText" [(ngModel)]="reportFileParameter.rgText" #rgText="ngModel" placeholder="rgText"/>

  <label for="rgText2">rgText2</label>
  <input name="rgText2" id="rgText2" [(ngModel)]="reportFileParameter.rgText2" #rgText2="ngModel" placeholder="rgText2"/>

  <label for="dataType">dataType</label>
  <input name="dataType" id="dataType" [(ngModel)]="reportFileParameter.dataType" #dataType="ngModel" placeholder="dataType"/>

  <label for="updatedAllowed">updatedAllowed</label>
  <input name="updatedAllowed" id="updatedAllowed" [(ngModel)]="reportFileParameter.updatedAllowed" #updatedAllowed="ngModel" placeholder="updatedAllowed"/>

  <label for="multiFlag">multiFlag</label>
  <input name="multiFlag" id="multiFlag" [(ngModel)]="reportFileParameter.multiFlag" #multiFlag="ngModel" placeholder="multiFlag"/>
  
  <button type="submit">submit</button>
</form>

</div>
