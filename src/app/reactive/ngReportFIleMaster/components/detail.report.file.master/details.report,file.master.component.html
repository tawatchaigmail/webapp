<H4>File Master Details </H4>
<div>
<form name="detailReportFIle" #detailForm="ngForm" (ngSubmit)="doSubmit(detailForm)">
  <label for="reportId">ReportId</label>
  <input name="reportId" id="reportId" required [(ngModel)]="reportFileMaster.reportId" placeholder="reportId"  />
  
  <label for="fileName">FileName</label>
  <input name="fileName" id="fileName" [(ngModel)]="reportFileMaster.fileName" placeholder="FileName"/>

  <label for="reportName">ReportName</label>
  <input name="reportName" id="reportName" [(ngModel)]="reportFileMaster.reportName" placeholder="reportName"/>

  <label for="description">Description</label>
  <input name="description" id="description" [(ngModel)]="reportFileMaster.description" placeholder="Description"/>

  <label for="reportGroup">ReportGroup</label>
  <input name="reportGroup" id="reportGroup" [(ngModel)]="reportFileMaster.reportGroup" placeholder="ReportGroup"/>

  <label for="orantation">Orantation</label>
  <input name="orantation" id="orantation" [(ngModel)]="reportFileMaster.orantation" placeholder="Orantation"/>
  
  <label for="ctrlDocNo">CtrlDocNo</label>
  <input name="ctrlDocNo" id="ctrlDocNo" [(ngModel)]="reportFileMaster.ctrlDocNo" placeholder="CtrlDocNo"/>

  <label for="flagLogFile">FlagLogFile</label>
  <input name="flagLogFile" id="flagLogFile" [(ngModel)]="reportFileMaster.flagLogFile" placeholder="FlagLogFile"/>

  <label for="showFooter">ShowFooter</label>
  <input name="showFooter" id="showFooter" [(ngModel)]="reportFileMaster.showFooter" placeholder="showFooter"/>

  <label for="formFooter">FormFooter</label>
  <input name="formFooter" id="formFooter" [(ngModel)]="reportFileMaster.formFooter" placeholder="formFooter"/>

  <label for="paperSize">PaperSize</label>
  <input name="paperSize" id="paperSize" [(ngModel)]="reportFileMaster.paperSize" placeholder="paperSize"/>

  <button type="submit">submit</button>
</form>
  <input type="button" value="previes"/>
  <input type="button" value="next"/>
</div>
